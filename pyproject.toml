[build-system]
requires = ["hatchling>=1.27,<2.0"]
build-backend = "hatchling.build"

[project]
name = "phyloencode"
version = "0.1"
description = "A Python package for phylogenetic data encoding. Designed to work with Phyddle format step output."
readme = "README.md"
authors = [
    {name = "Ammon Thompson", email = "ammonthompson@gmail.com"},
    {name = "Michael Landis", email = "michael.landis@wustl.edu"},
]
license = {text = "MIT"}
keywords = ["autoencoder", "bioinformatics", "phylogenetics", "machine learning", "deep learning"]
dependencies = [
    "dendropy >=5.0.8, <6.0",
    "h5py >=3.12.1, <4.0",
    "matplotlib >=3.10.0, <4.0",
    "numpy >=2.2.2, <3.0",
    "pandas >=2.2.3, <3.0",
    "phyddle >=0.3.0, <1.0",
    "scikit-learn >=1.6.1, <2.0",
    "setuptools <82",  # Phyddle 0.3 imports pkg_resources, removed in setuptools 82.
    "torch >=2.6.0, <3.0"
]
requires-python = ">=3.12"

[dependency-groups]
dev = [
    "pytest >=9.0, <10.0",
]

[project.scripts]
phyencode = "phyloencode.cli.cmd_encode:main"
phydecode = "phyloencode.cli.cmd_decode:main"
phytrain  = "phyloencode.cli.cmd_train:main"
phygen    = "phyloencode.cli.cmd_generate:main"
phypredict = "phyloencode.cli.cmd_predict:main"

[tool.hatch.build]
exclude = ["sandbox/**", "phyloencode.egg-info/**", "__pycache__/**", "*.pyc", "*.pyo", "*.log", ".git/**", "tests/**", "dev/**", ".vscode/**"]

[tool.hatch.build.targets.wheel]
packages = ["src/phyloencode"]
